[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mcp-tripwire"
version = "0.1.0"
description = "Know when an MCP server silently changes the tools your AI agent trusts. Pin tool descriptions, detect drift in CI, and scan for prompt-injection patterns."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "NestDaddy", email = "hello@nestdaddy.com" }]
keywords = ["mcp", "model-context-protocol", "security", "ai-agents", "tool-poisoning", "llm", "claude", "cursor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mcp-tripwire = "mcp_tripwire.cli:main"

[project.urls]
Homepage = "https://github.com/nestdaddy/mcp-tripwire"
Issues = "https://github.com/nestdaddy/mcp-tripwire/issues"
"MCP server directory" = "https://nestdaddy.com/mcp/servers"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_tripwire"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
